<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cash Flow Dashboard</title>
    <script>
      (() => {
        try {
          const storedTheme = localStorage.getItem("cashflow-dashboard-theme");
          document.documentElement.dataset.theme = storedTheme === "dark" ? "dark" : "light";
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Forum&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero hero--section">
        <div class="hero__section-brand">
          <h1 data-i18n="app_header_title"></h1>
        </div>
        <div class="hero__section">
          <div class="view-switch view-switch--compact app-mode-switch">
            <button
              class="view-button"
              type="button"
              data-app-mode="cashflow"
              data-i18n="app_section_cash_flow"
            ></button>
            <button
              class="view-button"
              type="button"
              data-app-mode="debts"
              data-i18n="app_section_debts"
            ></button>
            <button
              class="view-button"
              type="button"
              data-app-mode="credit"
              data-i18n="app_section_credit"
            ></button>
            <button
              class="view-button"
              type="button"
              data-app-mode="nutrition"
              data-i18n="app_section_nutrition"
            ></button>
          </div>
        </div>
        <div class="hero__tools">
          <div class="view-switch view-switch--compact language-switch">
            <button
              id="language-en"
              class="view-button"
              type="button"
              data-language="en"
            >
              EN
            </button>
            <button
              id="language-es"
              class="view-button"
              type="button"
              data-language="es"
            >
              ES
            </button>
          </div>

          <button id="theme-toggle" class="theme-toggle" type="button" aria-pressed="false">
            <span class="theme-toggle__track" aria-hidden="true">
              <span class="theme-toggle__sun-glow"></span>
              <span class="theme-toggle__band theme-toggle__band--1"></span>
              <span class="theme-toggle__band theme-toggle__band--2"></span>
              <span class="theme-toggle__cloud theme-toggle__cloud--small"></span>
              <span class="theme-toggle__cloud theme-toggle__cloud--large"></span>
              <span class="theme-toggle__star theme-toggle__star--1"></span>
              <span class="theme-toggle__star theme-toggle__star--2"></span>
              <span class="theme-toggle__star theme-toggle__star--3"></span>
              <span class="theme-toggle__star theme-toggle__star--4"></span>
              <span class="theme-toggle__thumb"></span>
            </span>
            <span id="theme-toggle-text" class="visually-hidden"></span>
          </button>
        </div>
      </header>

      <aside class="control-sidebar">
        <div class="control-sidebar__inner">
          <div id="cash-flow-controls" class="control-sidebar__cash-flow">
            <div class="control-sidebar__controls">
              <label class="field" for="year-select">
                <span class="field__label" data-i18n="year_label"></span>
                <div class="select-shell">
                  <select id="year-select" class="select"></select>
                </div>
              </label>
            </div>

            <div class="field control-sidebar__view">
              <span class="field__label" data-i18n="view_label"></span>
              <section id="sidebar-months" class="control-sidebar__months">
                <button
                  id="view-annual-button"
                  class="month-button control-sidebar__annual-button"
                  type="button"
                  data-view-mode="annual"
                  data-i18n="view_annual"
                ></button>
                <div id="sidebar-month-nav" class="month-nav month-nav--sidebar"></div>
              </section>
            </div>
          </div>

          <div id="debt-view-controls" class="control-sidebar__debt-view" hidden>
            <div class="field control-sidebar__view">
              <span class="field__label" data-i18n="view_label"></span>
              <section class="control-sidebar__months">
                <button
                  class="month-button control-sidebar__annual-button"
                  type="button"
                  data-debt-view="active"
                  data-i18n="debt_view_active"
                ></button>
                <button
                  class="month-button control-sidebar__annual-button"
                  type="button"
                  data-debt-view="canceled"
                  data-i18n="debt_view_canceled"
                ></button>
              </section>
            </div>
          </div>

          <div id="credit-view-controls" class="control-sidebar__credit-view" hidden>
            <div class="field control-sidebar__view">
              <span class="field__label" data-i18n="view_label"></span>
              <section class="control-sidebar__months">
                <button
                  class="month-button control-sidebar__annual-button is-active"
                  type="button"
                  aria-pressed="true"
                  aria-disabled="true"
                  tabindex="-1"
                  data-i18n="app_section_credit"
                ></button>
              </section>
            </div>
          </div>
        </div>
      </aside>

      <div class="content-shell">
        <main class="layout">
          <section id="annual-panel" class="panel">
          <div class="section-head">
            <div>
              <p class="section-head__eyebrow" data-i18n="annual_section_eyebrow"></p>
              <h2 id="annual-title"></h2>
            </div>
            <p id="annual-note" class="section-head__note" data-i18n="annual_note"></p>
          </div>

          <div id="annual-kpis" class="kpi-grid"></div>

          <div class="chart-grid chart-grid--annual">
            <article class="card">
              <div class="card__head">
                <div>
                  <p class="card__eyebrow" data-i18n="annual_free_eyebrow"></p>
                  <h3 data-i18n="annual_free_title"></h3>
                </div>
              </div>
              <div id="annual-free-chart" class="free-bars"></div>
            </article>

            <article class="card">
              <div class="card__head">
                <div>
                  <p class="card__eyebrow" data-i18n="distribution_eyebrow"></p>
                  <h3 data-i18n="annual_distribution_title"></h3>
                </div>
              </div>
              <div id="annual-donut" class="donut-layout"></div>
            </article>
          </div>

          <article class="card">
            <div class="card__head">
              <div>
                <p class="card__eyebrow" data-i18n="categories_eyebrow"></p>
                <h3 data-i18n="annual_categories_title"></h3>
              </div>
              <div class="sort-controls">
                <span class="sort-controls__label" data-i18n="category_sort_label"></span>
                <div class="view-switch view-switch--compact view-switch--sort">
                  <button
                    class="view-button"
                    type="button"
                    data-category-sort="name"
                    data-i18n="category_sort_name"
                  ></button>
                  <button
                    class="view-button"
                    type="button"
                    data-category-sort="value"
                  ></button>
                </div>
              </div>
            </div>
            <div id="annual-category-bars" class="bar-list"></div>
          </article>

          <article class="card">
            <div class="card__head">
              <div>
                <p class="card__eyebrow" data-i18n="detail_eyebrow"></p>
                <h3 data-i18n="annual_table_title"></h3>
              </div>
              <div class="sort-controls">
                <span class="sort-controls__label" data-i18n="annual_table_currency_label"></span>
                <div class="view-switch view-switch--compact view-switch--sort">
                  <button
                    class="view-button"
                    type="button"
                    data-annual-currency="cop"
                    data-i18n="currency_cop"
                  ></button>
                  <button
                    class="view-button"
                    type="button"
                    data-annual-currency="usd"
                    data-i18n="currency_usd"
                  ></button>
                </div>
              </div>
            </div>
            <div class="table-scroll">
              <table id="annual-summary-table" class="data-table data-table--annual"></table>
            </div>
          </article>
        </section>

        <section id="monthly-panel" class="panel">
          <div class="section-head section-head--stack">
            <div>
              <p class="section-head__eyebrow" data-i18n="monthly_section_eyebrow"></p>
              <h2 id="month-title"></h2>
            </div>
          </div>

          <div id="monthly-kpis" class="kpi-grid"></div>

          <div class="chart-grid">
            <article class="card">
              <div class="card__head">
                <div>
                  <p class="card__eyebrow" data-i18n="monthly_budget_eyebrow"></p>
                  <h3 data-i18n="monthly_budget_title"></h3>
                </div>
              </div>
              <div class="table-scroll table-scroll--compact">
                <table id="monthly-summary-table" class="data-table"></table>
              </div>
            </article>

            <article class="card">
              <div class="card__head">
                <div>
                  <p class="card__eyebrow" data-i18n="distribution_eyebrow"></p>
                  <h3 data-i18n="monthly_distribution_title"></h3>
                </div>
              </div>
              <div id="monthly-donut" class="donut-layout"></div>
            </article>
          </div>

          <article class="card">
            <div class="card__head card__head--detail">
              <div>
                <p class="card__eyebrow" data-i18n="monthly_incomes_eyebrow"></p>
                <h3 data-i18n="monthly_incomes_title"></h3>
              </div>
              <button
                id="add-income-button"
                class="button button--compact button--entry-add"
                type="button"
                data-i18n="add_income_button"
              ></button>
            </div>
            <p class="card__note card__note--detail" data-i18n="monthly_incomes_note"></p>
            <div class="table-scroll">
              <table id="monthly-incomes-table" class="data-table data-table--entries data-table--income-entries"></table>
            </div>
          </article>

          <article class="card">
            <div class="card__head">
              <div>
                <p class="card__eyebrow" data-i18n="monthly_outcomes_eyebrow"></p>
                <h3 data-i18n="monthly_outcomes_title"></h3>
              </div>
              <div class="sort-controls">
                <span class="sort-controls__label" data-i18n="category_sort_label"></span>
                <div class="view-switch view-switch--compact view-switch--sort">
                  <button
                    class="view-button"
                    type="button"
                    data-category-sort="name"
                    data-i18n="category_sort_name"
                  ></button>
                  <button
                    class="view-button"
                    type="button"
                    data-category-sort="value"
                  ></button>
                </div>
              </div>
            </div>
            <div id="monthly-category-bars" class="bar-list"></div>
          </article>

          <article class="card">
            <div class="card__head card__head--detail">
              <div>
                <p class="card__eyebrow" data-i18n="monthly_detail_eyebrow"></p>
                <h3 data-i18n="monthly_detail_title"></h3>
              </div>
              <button
                id="add-entry-button"
                class="button button--compact button--entry-add"
                type="button"
                data-i18n="add_entry_button"
              ></button>
            </div>
            <p class="card__note card__note--detail" data-i18n="monthly_detail_note"></p>
            <div class="table-scroll">
              <table id="monthly-entries-table" class="data-table data-table--entries"></table>
            </div>
          </article>
          </section>

          <section id="debts-panel" class="panel" hidden>
            <div class="section-head">
              <div>
                <p class="section-head__eyebrow" data-i18n="debts_section_eyebrow"></p>
                <h2 data-i18n="debts_title"></h2>
              </div>
              <p class="section-head__note" data-i18n="debts_note"></p>
            </div>

            <div id="debt-kpis" class="kpi-grid"></div>

            <article class="card">
              <div class="card__head card__head--detail">
                <div>
                  <p class="card__eyebrow" data-i18n="debts_table_eyebrow"></p>
                  <h3 id="debts-table-title" data-i18n="debts_table_title"></h3>
                </div>
                <button
                  id="add-debt-button"
                  class="button button--compact button--entry-add"
                  type="button"
                  data-i18n="add_debt_button"
                ></button>
              </div>
              <div class="table-scroll">
                <table id="debts-table" class="data-table data-table--debts"></table>
              </div>
            </article>
          </section>

          <section id="credit-simulator-panel" class="panel" hidden>
            <div class="section-head">
              <div>
                <p class="section-head__eyebrow" data-i18n="credit_section_eyebrow"></p>
                <h2 data-i18n="credit_title"></h2>
              </div>
              <p class="section-head__note" data-i18n="credit_note"></p>
            </div>

            <div class="chart-grid credit-simulator-layout">
              <article class="card credit-simulator-input-card">
                <div class="card__head">
                  <div>
                    <p class="card__eyebrow" data-i18n="credit_form_eyebrow"></p>
                    <h3 data-i18n="credit_form_title"></h3>
                  </div>
                </div>
                <form id="credit-simulator-form" class="credit-simulator-form">
                  <label class="field" for="credit-simulator-capital">
                    <span class="field__label" data-i18n="create_debt_capital"></span>
                    <input id="credit-simulator-capital" name="capital" class="entry-input entry-input--amount" type="text" inputmode="decimal" value="20000000" />
                  </label>

                  <label class="field" for="credit-simulator-initial-investment">
                    <span class="field__label" data-i18n="create_debt_initial_investment"></span>
                    <input id="credit-simulator-initial-investment" name="initial_investment" class="entry-input entry-input--amount" type="text" inputmode="decimal" value="0" />
                  </label>

                  <label class="field" for="credit-simulator-annual-interest">
                    <span class="field__label" data-i18n="create_debt_annual_interest"></span>
                    <input id="credit-simulator-annual-interest" name="annual_interest_rate" class="entry-input entry-input--amount" type="text" inputmode="decimal" value="20" />
                  </label>

                  <label class="field" for="credit-simulator-term-months">
                    <span class="field__label" data-i18n="create_debt_term_months"></span>
                    <input id="credit-simulator-term-months" name="term_months" class="entry-input entry-input--amount entry-input--no-spin" type="number" min="1" max="600" step="1" inputmode="numeric" value="12" />
                  </label>

                  <label class="field" for="credit-simulator-insurance">
                    <span class="field__label" data-i18n="create_debt_insurance"></span>
                    <input id="credit-simulator-insurance" name="insurance" class="entry-input entry-input--amount" type="text" inputmode="decimal" value="0" />
                  </label>

                  <label class="field" for="credit-simulator-other-charges">
                    <span class="field__label" data-i18n="create_debt_other_charges"></span>
                    <input id="credit-simulator-other-charges" name="other_charges" class="entry-input entry-input--amount" type="text" inputmode="decimal" value="0" />
                  </label>
                </form>
              </article>

              <article class="card credit-simulator-summary-card">
                <div class="card__head card__head--detail">
                  <div>
                    <p class="card__eyebrow" data-i18n="credit_summary_eyebrow"></p>
                    <h3 data-i18n="credit_summary_title"></h3>
                  </div>
                  <div id="credit-simulator-currency" class="debt-detail-dialog__currency"></div>
                </div>
                <div id="credit-simulator-summary"></div>
              </article>
            </div>

            <article class="card">
              <div class="card__head card__head--detail">
                <div>
                  <p class="card__eyebrow" data-i18n="credit_schedule_eyebrow"></p>
                  <h3 data-i18n="credit_schedule_title"></h3>
                </div>
              </div>
              <div class="table-scroll debt-detail-table-wrap credit-simulator-table-wrap">
                <table id="credit-simulator-table" class="data-table data-table--debt-detail"></table>
              </div>
            </article>
          </section>

          <section id="nutrition-panel" class="panel" hidden>
            <div class="section-head">
              <div>
                <p class="section-head__eyebrow" data-i18n="nutrition_section_eyebrow"></p>
                <h2 data-i18n="nutrition_title"></h2>
              </div>
              <p class="section-head__note" data-i18n="nutrition_note"></p>
            </div>
            <div id="nutrition-content" class="nutrition-layout"></div>
          </section>
        </main>
      </div>
    </div>

    <template id="empty-state-template">
      <div class="empty-state">
        <h3>Data could not be loaded</h3>
        <p id="empty-state-message"></p>
      </div>
    </template>

    <dialog id="debt-detail-dialog" class="history-dialog debt-detail-dialog">
      <div class="history-dialog__panel debt-detail-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p id="debt-detail-dialog-eyebrow" class="card__eyebrow"></p>
            <h3 id="debt-detail-dialog-title"></h3>
          </div>
          <div class="debt-detail-dialog__actions">
            <div id="debt-detail-dialog-currency" class="debt-detail-dialog__currency"></div>
            <button id="debt-detail-dialog-close" class="history-dialog__close" type="button">×</button>
          </div>
        </div>
        <div id="debt-detail-dialog-body" class="history-dialog__body debt-detail-dialog__body"></div>
      </div>
    </dialog>

    <dialog id="debt-link-dialog" class="history-dialog create-entry-dialog">
      <form id="debt-link-form" class="history-dialog__panel movement-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p class="card__eyebrow" data-i18n="debt_link_eyebrow"></p>
            <h3 data-i18n="debt_link_title"></h3>
          </div>
          <button id="debt-link-dialog-close" class="history-dialog__close" type="button">×</button>
        </div>

        <input id="debt-link-id" name="debt_id" type="hidden" />

        <section id="debt-link-current" class="debt-link-current" hidden>
          <div class="debt-link-current__head">
            <div>
              <p class="card__eyebrow" data-i18n="debt_link_current_eyebrow"></p>
              <h4 id="debt-link-current-description" class="debt-link-current__description"></h4>
            </div>
            <button
              id="debt-link-clear"
              class="entry-history-button debt-link-current__clear"
              type="button"
              data-i18n="debt_link_clear"
            ></button>
          </div>
          <ul id="debt-link-current-list" class="debt-link-current__list"></ul>
          <p id="debt-link-current-empty" class="debt-link-current__empty" hidden data-i18n="debt_link_current_empty"></p>
        </section>

        <div class="movement-form__grid">
          <label class="field" for="debt-link-year">
            <span class="field__label" data-i18n="debt_link_year"></span>
            <div class="entry-select-shell">
              <select
                id="debt-link-year"
                name="year"
                class="entry-select entry-select--pretty"
                required
              ></select>
            </div>
          </label>

          <label class="field" for="debt-link-month">
            <span class="field__label" data-i18n="debt_link_month"></span>
            <div class="entry-select-shell">
              <select
                id="debt-link-month"
                name="month"
                class="entry-select entry-select--pretty"
                required
              ></select>
            </div>
          </label>

          <label class="field movement-form__full" for="debt-link-name">
            <span class="field__label" data-i18n="debt_link_name"></span>
            <input
              id="debt-link-name"
              name="description"
              class="entry-input"
              type="text"
              autocomplete="off"
              maxlength="80"
            />
            <span class="field__hint" data-i18n="debt_link_name_hint"></span>
          </label>

          <label class="field movement-form__full" for="debt-link-abono-strategy">
            <span class="field__label" data-i18n="debt_abono_strategy_label"></span>
            <div class="entry-select-shell">
              <select
                id="debt-link-abono-strategy"
                name="abono_strategy"
                class="entry-select entry-select--pretty"
              >
                <option value="reduce_term" data-i18n="debt_abono_strategy_term"></option>
                <option value="reduce_payment" data-i18n="debt_abono_strategy_payment"></option>
              </select>
            </div>
            <span class="field__hint" data-i18n="debt_abono_strategy_meta"></span>
          </label>
        </div>

        <div class="movement-form__actions">
          <button
            id="debt-link-cancel"
            class="entry-history-button movement-form__cancel"
            type="button"
            data-i18n="debt_link_cancel"
          ></button>
          <button
            id="debt-link-submit"
            class="button button--compact button--entry-add"
            type="submit"
            data-i18n="debt_link_submit"
          ></button>
        </div>
      </form>
    </dialog>

    <dialog id="create-debt-dialog" class="history-dialog create-entry-dialog">
      <form id="create-debt-form" class="history-dialog__panel movement-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p class="card__eyebrow" data-i18n="create_debt_eyebrow"></p>
            <h3 data-i18n="create_debt_title"></h3>
          </div>
          <button id="create-debt-dialog-close" class="history-dialog__close" type="button">×</button>
        </div>

        <div class="movement-form__grid">
          <label class="field" for="create-debt-name">
            <span class="field__label" data-i18n="create_debt_name"></span>
            <input id="create-debt-name" name="name" class="entry-input entry-input--no-spin" type="text" required />
          </label>

          <label class="field" for="create-debt-capital">
            <span class="field__label" data-i18n="create_debt_capital"></span>
            <input id="create-debt-capital" name="capital" class="entry-input entry-input--amount entry-input--no-spin" type="number" min="0" step="0.01" inputmode="decimal" required />
          </label>

          <label class="field" for="create-debt-initial-investment">
            <span class="field__label" data-i18n="create_debt_initial_investment"></span>
            <input id="create-debt-initial-investment" name="initial_investment" class="entry-input entry-input--amount entry-input--no-spin" type="number" min="0" step="0.01" inputmode="decimal" value="0" />
          </label>

          <label class="field" for="create-debt-term-months">
            <span class="field__label" data-i18n="create_debt_term_months"></span>
            <input id="create-debt-term-months" name="term_months" class="entry-input entry-input--no-spin" type="number" min="1" max="600" step="1" inputmode="numeric" required />
          </label>

          <label class="field" for="create-debt-annual-interest">
            <span class="field__label" data-i18n="create_debt_annual_interest"></span>
            <input id="create-debt-annual-interest" name="annual_interest_rate" class="entry-input entry-input--no-spin" type="text" inputmode="decimal" value="0" />
          </label>

          <label class="field" for="create-debt-insurance">
            <span class="field__label" data-i18n="create_debt_insurance"></span>
            <input id="create-debt-insurance" name="insurance" class="entry-input entry-input--amount entry-input--no-spin" type="number" min="0" step="0.01" inputmode="decimal" value="0" />
          </label>

          <label class="field" for="create-debt-other-charges">
            <span class="field__label" data-i18n="create_debt_other_charges"></span>
            <input id="create-debt-other-charges" name="other_charges" class="entry-input entry-input--amount entry-input--no-spin" type="number" min="0" step="0.01" inputmode="decimal" value="0" />
          </label>

          <label class="field" for="create-debt-link-year">
            <span class="field__label" data-i18n="debt_link_year"></span>
            <div class="entry-select-shell">
              <select
                id="create-debt-link-year"
                name="cash_flow_link_year"
                class="entry-select entry-select--pretty"
                required
              ></select>
            </div>
          </label>

          <label class="field" for="create-debt-link-month">
            <span class="field__label" data-i18n="debt_link_month"></span>
            <div class="entry-select-shell">
              <select
                id="create-debt-link-month"
                name="cash_flow_link_month"
                class="entry-select entry-select--pretty"
                required
              ></select>
            </div>
          </label>

          <label class="field movement-form__full" for="create-debt-link-name">
            <span class="field__label" data-i18n="debt_link_name"></span>
            <input
              id="create-debt-link-name"
              name="cash_flow_link_description"
              class="entry-input entry-input--no-spin"
              type="text"
              autocomplete="off"
              maxlength="80"
            />
            <span class="field__hint" data-i18n="debt_link_name_hint"></span>
          </label>

          <label class="field movement-form__full" for="create-debt-abono-strategy">
            <span class="field__label" data-i18n="debt_abono_strategy_label"></span>
            <div class="entry-select-shell">
              <select
                id="create-debt-abono-strategy"
                name="abono_strategy"
                class="entry-select entry-select--pretty"
              >
                <option value="reduce_term" data-i18n="debt_abono_strategy_term"></option>
                <option value="reduce_payment" data-i18n="debt_abono_strategy_payment"></option>
              </select>
            </div>
            <span class="field__hint" data-i18n="debt_abono_strategy_meta"></span>
          </label>
        </div>

        <div class="movement-form__actions">
          <button
            id="create-debt-cancel"
            class="entry-history-button movement-form__cancel"
            type="button"
            data-i18n="create_debt_cancel"
          ></button>
          <button
            id="create-debt-submit"
            class="button button--compact button--entry-add"
            type="submit"
            data-i18n="create_debt_submit"
          ></button>
        </div>
      </form>
    </dialog>

    <dialog id="entry-history-dialog" class="history-dialog">
      <form method="dialog" class="history-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p id="history-dialog-eyebrow" class="card__eyebrow"></p>
            <h3 id="history-dialog-title"></h3>
          </div>
          <button id="history-dialog-close" class="history-dialog__close" type="submit">×</button>
        </div>
        <div id="history-dialog-body" class="history-dialog__body"></div>
      </form>
    </dialog>

    <dialog id="create-entry-dialog" class="history-dialog create-entry-dialog">
      <form id="create-entry-form" class="history-dialog__panel movement-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p id="create-entry-dialog-eyebrow" class="card__eyebrow" data-i18n="create_entry_eyebrow"></p>
            <h3 id="create-entry-dialog-title" data-i18n="create_entry_title"></h3>
          </div>
          <button id="create-entry-dialog-close" class="history-dialog__close" type="button">×</button>
        </div>

        <div class="movement-form__grid">
          <label class="field" for="create-entry-description">
            <span class="field__label" data-i18n="monthly_entries_description"></span>
            <input
              id="create-entry-description"
              name="description"
              class="entry-input"
              type="text"
              required
            />
          </label>

          <label class="field" for="create-entry-category">
            <span class="field__label" data-i18n="monthly_entries_category"></span>
            <div class="entry-select-shell">
              <select
                id="create-entry-category"
                name="category"
                class="entry-select entry-select--category"
                required
              ></select>
            </div>
          </label>

          <label class="field" for="create-entry-type">
            <span class="field__label" data-i18n="monthly_entries_type"></span>
            <div id="create-entry-type-shell" class="entry-type-shell">
              <select id="create-entry-type" name="type" class="entry-select entry-select--type" required></select>
            </div>
          </label>

          <label class="field" for="create-entry-amount">
            <span class="field__label" data-i18n="monthly_entries_cop"></span>
            <input
              id="create-entry-amount"
              name="amount_cop"
              class="entry-input entry-input--amount"
              type="number"
              step="0.01"
              inputmode="decimal"
              min="0"
              required
            />
          </label>

          <label class="field movement-form__active" for="create-entry-paid">
            <span class="field__label" data-i18n="monthly_entries_paid"></span>
            <span class="movement-form__active-control">
              <span class="movement-form__active-text" data-i18n="create_entry_paid_hint"></span>
              <span class="entry-active-toggle">
                <input
                  id="create-entry-paid"
                  name="paid"
                  class="entry-active-toggle__input"
                  type="checkbox"
                  checked
                />
                <span class="entry-active-toggle__ui" aria-hidden="true"></span>
              </span>
            </span>
          </label>

          <fieldset id="create-entry-debt-section" class="field movement-form__full create-entry-debt-section" hidden>
            <legend class="field__label" data-i18n="create_entry_debt_target"></legend>
            <p class="field__hint" data-i18n="create_entry_debt_hint"></p>
            <div id="create-entry-debt-list" class="create-entry-debt-list"></div>
          </fieldset>
        </div>

        <div class="movement-form__actions">
          <button
            id="create-entry-cancel"
            class="entry-history-button movement-form__cancel"
            type="button"
            data-i18n="create_entry_cancel"
          ></button>
          <button
            id="create-entry-submit"
            class="button button--compact button--entry-add"
            type="submit"
            data-i18n="create_entry_submit"
          ></button>
        </div>
      </form>
    </dialog>

    <dialog id="entry-debt-link-dialog" class="history-dialog create-entry-dialog">
      <form id="entry-debt-link-form" class="history-dialog__panel movement-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p id="entry-debt-link-dialog-eyebrow" class="card__eyebrow" data-i18n="entry_debt_link_eyebrow"></p>
            <h3 id="entry-debt-link-dialog-title" data-i18n="entry_debt_link_title"></h3>
          </div>
          <button id="entry-debt-link-dialog-close" class="history-dialog__close" type="button">×</button>
        </div>

        <div class="movement-form__grid">
          <fieldset id="entry-debt-link-section" class="field movement-form__full create-entry-debt-section">
            <legend class="field__label" data-i18n="entry_debt_link_target"></legend>
            <p class="field__hint" data-i18n="entry_debt_link_hint"></p>
            <div id="entry-debt-link-list" class="create-entry-debt-list"></div>
          </fieldset>
        </div>

        <div class="movement-form__actions">
          <button
            id="entry-debt-link-cancel"
            class="entry-history-button movement-form__cancel"
            type="button"
            data-i18n="entry_debt_link_cancel"
          ></button>
          <button
            id="entry-debt-link-submit"
            class="button button--compact button--entry-add"
            type="submit"
            data-i18n="entry_debt_link_submit"
          ></button>
        </div>
      </form>
    </dialog>

    <dialog id="create-income-dialog" class="history-dialog create-entry-dialog">
      <form id="create-income-form" class="history-dialog__panel movement-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p id="create-income-dialog-eyebrow" class="card__eyebrow" data-i18n="create_income_eyebrow"></p>
            <h3 id="create-income-dialog-title" data-i18n="create_income_title"></h3>
          </div>
          <button id="create-income-dialog-close" class="history-dialog__close" type="button">×</button>
        </div>

        <div class="movement-form__grid movement-form__grid--income">
          <label class="field" for="create-income-description">
            <span class="field__label" data-i18n="monthly_entries_description"></span>
            <input
              id="create-income-description"
              name="description"
              class="entry-input"
              type="text"
              required
            />
          </label>

          <label class="field" for="create-income-usd">
            <span class="field__label" data-i18n="monthly_entries_usd"></span>
            <input
              id="create-income-usd"
              name="amount_usd"
              class="entry-input entry-input--amount"
              type="number"
              step="any"
              inputmode="decimal"
              min="0"
            />
          </label>

          <label class="field" for="create-income-fx">
            <span class="field__label" data-i18n="monthly_income_fx"></span>
            <input
              id="create-income-fx"
              name="usd_cop"
              class="entry-input entry-input--amount"
              type="number"
              step="any"
              inputmode="decimal"
              min="0"
              required
            />
          </label>

          <label class="field" for="create-income-cop">
            <span class="field__label" data-i18n="monthly_entries_cop"></span>
            <input
              id="create-income-cop"
              name="amount_cop"
              class="entry-input entry-input--amount"
              type="number"
              step="any"
              inputmode="decimal"
              min="0"
            />
          </label>

          <label class="field movement-form__active" for="create-income-received">
            <span class="field__label" data-i18n="monthly_income_received"></span>
            <span class="movement-form__active-control">
              <span class="movement-form__active-text" data-i18n="create_income_received_hint"></span>
              <span class="entry-active-toggle">
                <input
                  id="create-income-received"
                  name="received"
                  class="entry-active-toggle__input"
                  type="checkbox"
                  checked
                />
                <span class="entry-active-toggle__ui" aria-hidden="true"></span>
              </span>
            </span>
          </label>
        </div>

        <div class="movement-form__actions">
          <button
            id="create-income-cancel"
            class="entry-history-button movement-form__cancel"
            type="button"
            data-i18n="create_income_cancel"
          ></button>
          <button
            id="create-income-submit"
            class="button button--compact button--entry-add"
            type="submit"
            data-i18n="create_income_submit"
          ></button>
        </div>
      </form>
    </dialog>

    <dialog
      id="delete-confirm-dialog"
      class="history-dialog delete-confirm-dialog"
      aria-labelledby="delete-confirm-title"
      aria-describedby="delete-confirm-message"
    >
      <form id="delete-confirm-form" method="dialog" class="history-dialog__panel delete-confirm-dialog__panel">
        <div class="history-dialog__head">
          <div>
            <p class="card__eyebrow" data-i18n="delete_confirm_eyebrow"></p>
            <h3 id="delete-confirm-title"></h3>
          </div>
          <button
            id="delete-confirm-close"
            class="history-dialog__close"
            type="submit"
            value="cancel"
            aria-label="Cancel"
          >
            ×
          </button>
        </div>

        <div class="delete-confirm-dialog__content">
          <p id="delete-confirm-message" class="delete-confirm-dialog__message"></p>

          <div class="delete-confirm-dialog__record">
            <span class="delete-confirm-dialog__icon" aria-hidden="true">!</span>
            <p id="delete-confirm-summary" class="delete-confirm-dialog__summary"></p>
          </div>
        </div>

        <div class="delete-confirm-dialog__actions">
          <button
            id="delete-confirm-submit"
            class="button button--compact delete-confirm-dialog__submit"
            type="button"
            value="confirm"
            data-i18n="delete_confirm_submit"
          ></button>
        </div>
      </form>
    </dialog>

    <script type="module" src="app.js"></script>
  </body>
</html>
